[preset.1]

name="Web"
platform="Web"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="data/*.json, data/i18n/*.json"
exclude_filter="tools/*"
export_path="export/web/index.html"

[preset.1.options]

variant/thread_support=false
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/head_include="<meta name=\"apple-mobile-web-app-capable\" content=\"yes\">
<meta name=\"mobile-web-app-capable\" content=\"yes\">
<meta name=\"apple-mobile-web-app-status-bar-style\" content=\"black\">
<meta name=\"apple-mobile-web-app-title\" content=\"Space Shooter\">
<meta name=\"theme-color\" content=\"#000000\">
<script>
// Space Shooter: ceiling for the canvas pixel density (Godot draws devicePixelRatio times more pixels than CSS points).
// The game lowers window.ssDprCap with graphics quality (Main.DPR_CAP).
(function () {
	var d = Object.getOwnPropertyDescriptor(window, 'devicePixelRatio') || Object.getOwnPropertyDescriptor(Window.prototype, 'devicePixelRatio');
	if (!d || !d.get) return;
	window.ssDprCap = 2;
	window.ssDprReal = function () { return d.get.call(window) || 1; };
	try {
		Object.defineProperty(window, 'devicePixelRatio', { configurable: true, get: function () { return Math.min(window.ssDprReal(), window.ssDprCap); } });
	} catch (e) {}
})();
</script>"
progressive_web_app/enabled=true
progressive_web_app/ensure_cross_origin_isolation_headers=false
progressive_web_app/display=1
progressive_web_app/orientation=2
progressive_web_app/background_color=Color(0, 0, 0, 1)
