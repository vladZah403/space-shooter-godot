[preset.0]

name="Windows"
platform="Windows Desktop"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="data/*.json, data/i18n/*.json"
exclude_filter="tools/*"
export_path="export/windows/SpaceShooter.exe"

[preset.0.options]

binary_format/embed_pck=true
application/product_name="Space Shooter"
application/file_description="Space Shooter"

[preset.1]

name="Web"
platform="Web"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="data/*.json, data/i18n/*.json"
exclude_filter="tools/*"
export_path="export/web/index.html"

[preset.1.options]

variant/thread_support=false
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/head_include="<meta name=\"apple-mobile-web-app-capable\" content=\"yes\">
<meta name=\"mobile-web-app-capable\" content=\"yes\">
<meta name=\"apple-mobile-web-app-status-bar-style\" content=\"black\">
<meta name=\"apple-mobile-web-app-title\" content=\"Space Shooter\">
<meta name=\"theme-color\" content=\"#000000\">"
progressive_web_app/enabled=true
progressive_web_app/ensure_cross_origin_isolation_headers=false
progressive_web_app/display=1
progressive_web_app/orientation=2
progressive_web_app/background_color=Color(0, 0, 0, 1)
